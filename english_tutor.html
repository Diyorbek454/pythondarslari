<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>English Tutor</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #f4f3ef; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center; padding: 2rem 1rem; }
  #app { width: 100%; max-width: 680px; }
  #header { padding: 1rem 1.25rem; background: #fff; border: 0.5px solid #ddd; border-radius: 12px; margin-bottom: 1rem; display: flex; align-items: center; gap: 12px; }
  #header-icon { width: 40px; height: 40px; border-radius: 50%; background: #e6f1fb; display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
  #header-text h2 { font-size: 16px; font-weight: 500; color: #111; }
  #header-text p { font-size: 13px; color: #666; margin-top: 2px; }
  #level-bar { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
  .level-badge { font-size: 12px; padding: 4px 12px; border-radius: 8px; border: 0.5px solid #ccc; cursor: pointer; color: #666; background: #fff; transition: all 0.15s; }
  .level-badge.active { background: #e6f1fb; color: #185fa5; border-color: transparent; font-weight: 500; }
  #chat-box { background: #fff; border: 0.5px solid #ddd; border-radius: 12px; padding: 1rem; min-height: 340px; max-height: 420px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 1rem; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 12px; font-size: 14px; line-height: 1.6; }
  .msg.ai { align-self: flex-start; background: #f4f3ef; color: #111; border-bottom-left-radius: 4px; }
  .msg.user { align-self: flex-end; background: #e6f1fb; color: #185fa5; border-bottom-right-radius: 4px; }
  .msg.feedback { align-self: flex-start; background: #eaf3de; color: #3b6d11; border-left: 2px solid #639922; max-width: 92%; font-size: 13px; border-radius: 8px; }
  .msg.error { align-self: flex-start; background: #faeeda; color: #854f0b; border-left: 2px solid #ba7517; max-width: 92%; font-size: 13px; border-radius: 8px; }
  #input-row { display: flex; gap: 8px; }
  #user-input { flex: 1; padding: 10px 14px; font-size: 14px; border: 0.5px solid #bbb; border-radius: 8px; background: #fff; color: #111; font-family: inherit; height: 44px; }
  #user-input:focus { outline: none; border-color: #888; }
  #send-btn { padding: 0 20px; height: 44px; border-radius: 8px; border: 0.5px solid #bbb; background: #fff; color: #111; font-size: 14px; cursor: pointer; font-family: inherit; white-space: nowrap; transition: background 0.1s; }
  #send-btn:hover { background: #f4f3ef; }
  #send-btn:disabled { opacity: 0.4; cursor: default; }
  #stats-row { display: flex; gap: 8px; margin-top: 1rem; }
  .stat-card { flex: 1; background: #f4f3ef; border-radius: 8px; padding: 10px 12px; text-align: center; }
  .stat-card .num { font-size: 20px; font-weight: 500; color: #111; }
  .stat-card .lbl { font-size: 11px; color: #666; margin-top: 2px; }
  .typing { display: flex; gap: 4px; align-items: center; padding: 10px 14px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #999; animation: blink 1.2s infinite; }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%,80%,100%{opacity:0.2} 40%{opacity:1} }
</style>
</head>
<body>
<div id="app">
  <div id="header">
    <div id="header-icon">🎓</div>
    <div id="header-text">
      <h2>English Tutor</h2>
      <p>Practice speaking, grammar &amp; vocabulary</p>
    </div>
  </div>

  <div id="level-bar">
    <div class="level-badge active" data-level="Beginner">Beginner (A1–A2)</div>
    <div class="level-badge" data-level="Intermediate">Intermediate (B1–B2)</div>
    <div class="level-badge" data-level="Advanced">Advanced (C1)</div>
  </div>

  <div id="chat-box"></div>

  <div id="input-row">
    <input id="user-input" type="text" placeholder="Type your answer here..." />
    <button id="send-btn">Send ↗</button>
  </div>

  <div id="stats-row">
    <div class="stat-card"><div class="num" id="s-turns">0</div><div class="lbl">Exchanges</div></div>
    <div class="stat-card"><div class="num" id="s-correct">0</div><div class="lbl">Correct</div></div>
    <div class="stat-card"><div class="num" id="s-level" style="font-size:13px;padding-top:4px;">Beginner</div><div class="lbl">Current level</div></div>
  </div>
</div>

<script>
const chatBox = document.getElementById('chat-box');
const input = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
let currentLevel = 'Beginner';
let turns = 0, correct = 0;
let history = [];
let awaitingResponse = false;

const systemPrompt = `You are a professional AI English Tutor for an interactive web app.

GOAL: Help users improve English through dynamic conversation — ask questions, evaluate answers, adapt difficulty.

USER LEVEL SYSTEM: Beginner (A1-A2), Intermediate (B1-B2), Advanced (C1).

CORE RULES:
1. Ask ONLY ONE question at a time.
2. Always wait for the user's response before continuing.
3. Questions must be in English only.
4. Keep questions clear, natural, conversational.
5. Do NOT ask multiple questions in one message.
6. Avoid long explanations unless necessary.
7. Keep ALL responses under 80 words.

ADAPTIVE DIFFICULTY:
- Correct answer → increase complexity slightly
- Small mistakes → keep same level, give correction
- Struggles/wrong → simplify next question

EVALUATION FORMAT after each user response:
If there's an error: "Correction: [corrected sentence]. [Short tip]. Next question: [question]?"
If correct: "[Short encouragement]. Next question: [question]?"

QUESTION GENERATION:
Beginner: simple present/past, daily topics (food, family, hobbies)
Intermediate: opinions, experiences, why/how questions
Advanced: abstract topics, arguments, discussions, comparisons

TONE: Friendly but professional. No emojis. No overpraise. Short encouragement only.

CURRENT USER LEVEL: {{LEVEL}}

Start the session with a greeting and ONE beginner question about their favorite food or hobby.`;

function addMsg(text, type) {
  const div = document.createElement('div');
  div.className = 'msg ' + type;
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  return div;
}

function addTyping() {
  const div = document.createElement('div');
  div.className = 'msg ai typing';
  div.id = 'typing-indicator';
  div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typing-indicator');
  if (t) t.remove();
}

function updateStats() {
  document.getElementById('s-turns').textContent = turns;
  document.getElementById('s-correct').textContent = correct;
  document.getElementById('s-level').textContent = currentLevel;
}

async function callClaude(userMessage) {
  if (userMessage) {
    history.push({ role: 'user', content: userMessage });
  }

  const sysPrompt = systemPrompt.replace('{{LEVEL}}', currentLevel);

  // NOTE: Replace 'YOUR_API_KEY_HERE' with your actual Anthropic API key
  const response = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'x-api-key': 'YOUR_API_KEY_HERE',
      'anthropic-version': '2023-06-01'
    },
    body: JSON.stringify({
      model: 'claude-sonnet-4-20250514',
      max_tokens: 1000,
      system: sysPrompt,
      messages: history
    })
  });

  const data = await response.json();
  const text = data.content?.map(b => b.text || '').join('') || 'Sorry, something went wrong.';
  history.push({ role: 'assistant', content: text });
  return text;
}

function detectFeedbackType(reply) {
  const lower = reply.toLowerCase();
  if (lower.includes('correction:') || lower.includes('watch your') || lower.includes('small mistake')) return 'error';
  if (lower.includes('great') || lower.includes('good') || lower.includes('excellent') || lower.includes('well done') || lower.includes('perfect')) return 'feedback';
  return 'ai';
}

async function sendMessage() {
  const text = input.value.trim();
  if (!text || awaitingResponse) return;

  awaitingResponse = true;
  sendBtn.disabled = true;
  input.value = '';
  turns++;

  addMsg(text, 'user');
  addTyping();

  try {
    const reply = await callClaude(text);
    removeTyping();
    const msgType = detectFeedbackType(reply);
    addMsg(reply, msgType);
    if (msgType === 'feedback') correct++;

    const lowerReply = reply.toLowerCase();
    if (lowerReply.includes('intermediate')) currentLevel = 'Intermediate';
    else if (lowerReply.includes('advanced')) currentLevel = 'Advanced';
    else if (lowerReply.includes('beginner')) currentLevel = 'Beginner';

    updateStats();
  } catch(e) {
    removeTyping();
    addMsg('Connection error. Please try again.', 'error');
  }

  awaitingResponse = false;
  sendBtn.disabled = false;
  input.focus();
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
sendBtn.addEventListener('click', sendMessage);

document.querySelectorAll('.level-badge').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.level-badge').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    currentLevel = b.dataset.level;
    updateStats();
  });
});

async function init() {
  awaitingResponse = true;
  sendBtn.disabled = true;
  addTyping();
  try {
    const greeting = await callClaude(null);
    removeTyping();
    addMsg(greeting, 'ai');
  } catch(e) {
    removeTyping();
    addMsg("Hi! Let's practice English. What is your favorite food?", 'ai');
    history.push({ role: 'assistant', content: "Hi! Let's practice English. What is your favorite food?" });
  }
  awaitingResponse = false;
  sendBtn.disabled = false;
  input.focus();
}

init();
</script>
</body>
</html>
